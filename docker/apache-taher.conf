<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # The container only ever receives requests forwarded by Caddy under
    # /taher/* (with that prefix left IN PLACE — see the Caddyfile route).
    # This Alias, not a plain DocumentRoot, is what makes PHP's SCRIPT_NAME
    # come out as "/taher/index.php": Laravel (via Symfony's Request) reads
    # that to auto-detect its own base path, so url()/route()/asset() and
    # every redirect automatically include "/taher" with no app code needed.
    # Verified: without this Alias, generated links are missing the prefix.
    Alias /taher /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        Require all granted

        # .htaccess is deliberately ignored. Laravel's stock one rewrites to a
        # relative "index.php", and reached through Alias, Apache turned that
        # into "/index.php" (SCRIPT_NAME lost the /taher prefix, so every
        # route except the bare "/taher/" 404'd) — RewriteBase did not fix it.
        # FallbackResource sends any non-file request to the front controller
        # by an explicit URL path, so SCRIPT_NAME is always /taher/index.php.
        AllowOverride None
        FallbackResource /taher/index.php

        # What the stock .htaccess rule "E=HTTP_AUTHORIZATION" would have done.
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
