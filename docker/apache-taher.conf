<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # The container only ever receives requests forwarded by Caddy under
    # /taher/* (with that prefix left IN PLACE — see the Caddyfile route).
    # This Alias, not a plain DocumentRoot, is what makes PHP's SCRIPT_NAME
    # come out as "/taher/index.php": Laravel (via Symfony's Request) reads
    # that to auto-detect its own base path, so url()/route()/asset() and
    # every redirect automatically include "/taher" with no app code needed.
    # Verified: without this Alias, generated links are missing the prefix.
    Alias /taher /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Laravel's own public/.htaccess handles the rewrite to index.php.
        AllowOverride All
        Require all granted

        # Laravel's .htaccess rewrites to a *relative* target ("RewriteRule ^
        # index.php [L]"), so Apache has to guess what URL prefix to put back
        # in front of it. With a real DocumentRoot it guesses right; reached
        # via Alias, it guesses wrong for anything that actually hits this
        # rule — which is every request except the bare directory root
        # (that one is served straight off DirectoryIndex, never touching
        # the rewrite, which is why only "/taher/" ever worked). Setting
        # RewriteBase removes the guesswork.
        RewriteEngine On
        RewriteBase /taher
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
